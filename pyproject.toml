[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raw-to-jpeg"
version = "0.1.0"
description = "Convert folders of mixed image files into JPEGs."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "Pillow>=10",
  "pillow-heif>=0.16",
  "rawpy>=0.19",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
raw-to-jpeg = "raw_to_jpeg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["raw_to_jpeg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
